<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat vs Dog Classifier</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Cat vs. Dog Classifier</h1>
        <p class="subtitle">Upload an image or let the model predict a random one from the test set.</p>
        
        <div class="upload-container">
            <input type="file" id="image-upload" class="hidden" accept="image/*">
            <label for="image-upload" class="btn">Choose an Image</label>
            <button id="random-predict-btn" class="btn">Predict Random</button>
        </div>
        
        <div id="image-preview" class="image-preview">
            <img id="preview-img" src="#" alt="Image Preview">
        </div>

        <div id="loader-container" class="hidden">
            <div class="loader"></div>
            <span>Predicting...</span>
        </div>
        
        <div id="prediction-result" class="prediction-result">
            <h2 id="actual-class-title" class="hidden">Actual: <span id="actual-class"></span></h2>
            <h2><span id="predicted-class"></span></h2>
            <p>Confidence: <span id="confidence-score"></span></p>
        </div>
    </div>

    <footer>
        <p>Developed by Akshat Saxena</p>
        <p>Email: akshatsaxena1977@gmail.com | Contact: 8266093563</p>
    </footer>

    <script>
        const imageUpload = document.getElementById('image-upload');
        const randomPredictBtn = document.getElementById('random-predict-btn');
        const imagePreview = document.getElementById('image-preview');
        const previewImg = document.getElementById('preview-img');
        const predictionResult = document.getElementById('prediction-result');
        const predictedClass = document.getElementById('predicted-class');
        const confidenceScore = document.getElementById('confidence-score');
        const actualClassTitle = document.getElementById('actual-class-title');
        const actualClass = document.getElementById('actual-class');
        const loaderContainer = document.getElementById('loader-container');

        function showLoader() {
            loaderContainer.classList.remove('hidden');
        }

        function hideLoader() {
            loaderContainer.classList.add('hidden');
        }

        function resetUI() {
            predictionResult.classList.remove('visible');
            actualClassTitle.classList.add('hidden');
            imagePreview.classList.remove('visible');
        }

        function handlePrediction(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                previewImg.src = e.target.result;
                resetUI();
                imagePreview.classList.add('visible');
                showLoader();
                
                const formData = new FormData();
                formData.append('file', file);

                fetch('/predict', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    hideLoader();
                    if (data.error) {
                        predictedClass.textContent = 'Error';
                        confidenceScore.textContent = data.error;
                    } else {
                        predictedClass.textContent = data.prediction;
                        confidenceScore.textContent = data.confidence;
                    }
                    predictionResult.classList.add('visible');
                })
                .catch(error => {
                    hideLoader();
                    predictedClass.textContent = 'Error';
                    confidenceScore.textContent = 'An error occurred during prediction.';
                    predictionResult.classList.add('visible');
                });
            }
            reader.readAsDataURL(file);
        }

        imageUpload.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                handlePrediction(file);
            }
        });

        randomPredictBtn.addEventListener('click', function() {
            resetUI();
            showLoader();

            fetch('/predict_random')
                .then(response => response.json())
                .then(data => {
                    hideLoader();
                    if (data.error) {
                        predictedClass.textContent = 'Error';
                        confidenceScore.textContent = data.error;
                    } else {
                        previewImg.src = data.image_data;
                        imagePreview.classList.add('visible');
                        predictedClass.textContent = data.prediction;
                        confidenceScore.textContent = data.confidence;
                        actualClass.textContent = data.actual.charAt(0).toUpperCase() + data.actual.slice(1);
                        actualClassTitle.classList.remove('hidden');
                    }
                    predictionResult.classList.add('visible');
                })
                .catch(error => {
                    hideLoader();
                    predictedClass.textContent = 'Error';
                    confidenceScore.textContent = 'An error occurred during prediction.';
                    predictionResult.classList.add('visible');
                });
        });
    </script>
</body>
</html>
