<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat vs Dog Classifier</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Cat vs. Dog Classifier</h1>
        <p>Upload an image or let the model predict a random one from the test set.</p>
        
        <div class="upload-container">
            <input type="file" id="image-upload" accept="image/*" style="display: none;">
            <label for="image-upload" class="upload-label">Choose an Image</label>
            <button id="random-predict-btn" class="upload-label">Predict Random Image</button>
        </div>
        
        <div id="image-preview" class="image-preview" style="display:none;">
            <img id="preview-img" src="#" alt="Image Preview">
        </div>
        
        <div id="prediction-result" class="prediction-result" style="display:none;">
            <h2 id="actual-class-title" style="display:none;">Actual: <span id="actual-class"></span></h2>
            <h2>Prediction: <span id="predicted-class"></span></h2>
            <p>Confidence: <span id="confidence-score"></span></p>
        </div>

        <div id="loader" class="loader" style="display:none;"></div>
    </div>

    <footer>
        <p>Developed by Akshat Saxena</p>
        <p>Email: akshatsaxena1977@gmail.com | Contact: 8266093563</p>
    </footer>

    <script>
        const imageUpload = document.getElementById('image-upload');
        const randomPredictBtn = document.getElementById('random-predict-btn');
        const imagePreview = document.getElementById('image-preview');
        const previewImg = document.getElementById('preview-img');
        const predictionResult = document.getElementById('prediction-result');
        const predictedClass = document.getElementById('predicted-class');
        const confidenceScore = document.getElementById('confidence-score');
        const actualClassTitle = document.getElementById('actual-class-title');
        const actualClass = document.getElementById('actual-class');
        const loader = document.getElementById('loader');

        // Handle file upload
        imageUpload.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImg.src = e.target.result;
                    imagePreview.style.display = 'block';
                    predictionResult.style.display = 'none';
                    actualClassTitle.style.display = 'none';
                    loader.style.display = 'block';
                    
                    const formData = new FormData();
                    formData.append('file', file);

                    fetch('/predict', {
                        method: 'POST',
                        body: formData
                    })
                    .then(response => response.json())
                    .then(data => {
                        loader.style.display = 'none';
                        if (data.error) {
                            predictedClass.textContent = 'Error';
                            confidenceScore.textContent = data.error;
                        } else {
                            predictedClass.textContent = data.prediction;
                            confidenceScore.textContent = data.confidence;
                        }
                        predictionResult.style.display = 'block';
                    })
                    .catch(error => {
                        loader.style.display = 'none';
                        predictedClass.textContent = 'Error';
                        confidenceScore.textContent = 'An error occurred during prediction.';
                        predictionResult.style.display = 'block';
                    });
                }
                reader.readAsDataURL(file);
            }
        });

        // Handle random prediction
        randomPredictBtn.addEventListener('click', function() {
            imagePreview.style.display = 'block';
            predictionResult.style.display = 'none';
            actualClassTitle.style.display = 'none';
            loader.style.display = 'block';

            fetch('/predict_random')
                .then(response => response.json())
                .then(data => {
                    loader.style.display = 'none';
                    if (data.error) {
                        predictedClass.textContent = 'Error';
                        confidenceScore.textContent = data.error;
                    } else {
                        previewImg.src = data.image_data;
                        predictedClass.textContent = data.prediction;
                        confidenceScore.textContent = data.confidence;
                        actualClass.textContent = data.actual.charAt(0).toUpperCase() + data.actual.slice(1);
                        actualClassTitle.style.display = 'block';
                    }
                    predictionResult.style.display = 'block';
                })
                .catch(error => {
                    loader.style.display = 'none';
                    predictedClass.textContent = 'Error';
                    confidenceScore.textContent = 'An error occurred during prediction.';
                    predictionResult.style.display = 'block';
                });
        });
    </script>
</body>
</html>
